name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: |
          VER=$(grep -oP 'versionName "\K[^"]+' app/build.gradle)
          mv app/build/outputs/apk/release/app-release.apk "islam-dweikat-plant-doctor-v${VER}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: islam-dweikat-plant-doctor
          path: islam-dweikat-plant-doctor-v*.apk
